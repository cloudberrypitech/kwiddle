<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwiddle Updates & Announcements</title>
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0984e3;
            --bg: #f5f6fa;
            --text: #636e72;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        /* Latest Update Spotlight */
        .latest-card {
            background: var(--white);
            border-left: 8px solid var(--accent);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 60px;
        }

        .badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .latest-card h2 {
            margin: 15px 0;
            font-size: 1.8rem;
        }

        /* History Section */
        .history-section h3 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--text);
        }

        .history-item {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: transform 0.2s;
            border: 1px solid #eee;
        }

        .history-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .item-date {
            font-size: 0.85rem;
            color: var(--text);
            font-weight: bold;
        }

        .item-title {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .item-content {
            color: var(--text);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Announcements</h1>
            <p>Stay up to date with the latest from Kwiddle</p>
        </header>

        <div id="latest-update">
            <!-- Latest update injected here -->
        </div>

        <div class="history-section">
            <h3>Update History</h3>
            <div id="history-list">
                <!-- History items injected here -->
            </div>
        </div>
    </div>

    <script>
        async function loadUpdates() {
            try {
                const response = await fetch('announcements.json');
                const data = await response.json();

                if (data.length === 0) {
                    document.getElementById('latest-update').innerHTML = "<p>No updates yet.</p>";
                    return;
                }

                // 1. Handle the Latest Update (First item in JSON)
                const latest = data[0];
                document.getElementById('latest-update').innerHTML = `
                    <div class="latest-card">
                        <span class="badge">Latest Update</span>
                        <h2>${latest.title}</h2>
                        <p class="item-date">${latest.date}</p>
                        <p class="item-content">${latest.content}</p>
                    </div>
                `;

                // 2. Handle the History (All items)
                const historyList = document.getElementById('history-list');
                historyList.innerHTML = data.map(item => `
                    <div class="history-item">
                        <span class="item-date">${item.date}</span>
                        <span class="item-title">${item.title}</span>
                        <div class="item-content">${item.content}</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error("Error loading JSON:", error);
                document.getElementById('latest-update').innerHTML = "<p>Error loading updates. Please try again later.</p>";
            }
        }

        loadUpdates();
    </script>
</body>
</html>
