name: Build public-domain classics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: write

concurrency:
  group: public-domain-classics
  cancel-in-progress: false

jobs:
  build-books:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kwiddle
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download complete Project Gutenberg texts and package as ODT
        run: |
          python - <<'PY'
          import hashlib
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          books = [
              (11, "Alice's Adventures in Wonderland", "Lewis Carroll", "alice-adventures-in-wonderland.odt"),
              (1661, "The Adventures of Sherlock Holmes", "Arthur Conan Doyle", "the-adventures-of-sherlock-holmes.odt"),
              (1342, "Pride and Prejudice", "Jane Austen", "pride-and-prejudice.odt"),
              (55, "The Wonderful Wizard of Oz", "L. Frank Baum", "the-wonderful-wizard-of-oz.odt"),
              (35, "The Time Machine", "H. G. Wells", "the-time-machine.odt"),
          ]

          NS = {
              "office": "urn:oasis:names:tc:opendocument:xmlns:office:1.0",
              "text": "urn:oasis:names:tc:opendocument:xmlns:text:1.0",
              "style": "urn:oasis:names:tc:opendocument:xmlns:style:1.0",
              "fo": "urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0",
              "meta": "urn:oasis:names:tc:opendocument:xmlns:meta:1.0",
              "manifest": "urn:oasis:names:tc:opendocument:xmlns:manifest:1.0",
              "dc": "http://purl.org/dc/elements/1.1/",
          }
          for prefix, uri in NS.items():
              ET.register_namespace(prefix, uri)

          def q(prefix, name):
              return "{" + NS[prefix] + "}" + name

          def make_odt(destination, title, author, source_id, source_text):
              root = ET.Element(q("office", "document-content"), {q("office", "version"): "1.3"})
              automatic = ET.SubElement(root, q("office", "automatic-styles"))
              body = ET.SubElement(root, q("office", "body"))
              text_body = ET.SubElement(body, q("office", "text"))
              ET.SubElement(text_body, q("text", "h"), {q("text", "style-name"): "Title", q("text", "outline-level"): "1"}).text = title
              ET.SubElement(text_body, q("text", "p"), {q("text", "style-name"): "Subtitle"}).text = "by " + author
              ET.SubElement(text_body, q("text", "p")).text = "Project Gutenberg eBook #" + str(source_id)
              ET.SubElement(text_body, q("text", "p")).text = ""

              chapter = re.compile(r"^(CHAPTER|Chapter)\s+([IVXLCDM]+|\d+)(?:[.: —-].*)?$")
              all_caps = re.compile(r"^[A-Z][A-Z0-9 ,:'’&!?()—-]{3,90}$")
              for raw_line in source_text.replace("\r\n", "\n").replace("\r", "\n").split("\n"):
                  line = raw_line.rstrip()
                  if not line.strip():
                      continue
                  stripped = line.strip()
                  if chapter.match(stripped) or roman_heading.match(stripped) or numbered_heading.match(stripped) or (all_caps.match(stripped) and len(stripped) < 90):
                      ET.SubElement(text_body, q("text", "h"), {
                          q("text", "style-name"): "Heading_1",
                          q("text", "outline-level"): "1",
                      }).text = stripped
                  else:
                      ET.SubElement(text_body, q("text", "p")).text = line

              content_xml = ET.tostring(root, encoding="utf-8", xml_declaration=True)

              styles = ET.Element(q("office", "document-styles"), {q("office", "version"): "1.3"})
              common = ET.SubElement(styles, q("office", "styles"))
              title_style = ET.SubElement(common, q("style", "style"), {
                  q("style", "name"): "Title", q("style", "family"): "paragraph",
                  q("style", "class"): "title",
              })
              ET.SubElement(title_style, q("style", "paragraph-properties"), {
                  q("fo", "text-align"): "center", q("fo", "margin-top"): "2cm",
                  q("fo", "margin-bottom"): "0.5cm",
              })
              ET.SubElement(title_style, q("style", "text-properties"), {
                  q("fo", "font-size"): "24pt", q("fo", "font-weight"): "bold",
              })
              subtitle = ET.SubElement(common, q("style", "style"), {
                  q("style", "name"): "Subtitle", q("style", "family"): "paragraph",
              })
              ET.SubElement(subtitle, q("style", "paragraph-properties"), {q("fo", "text-align"): "center"})
              heading = ET.SubElement(common, q("style", "style"), {
                  q("style", "name"): "Heading_1", q("style", "family"): "paragraph",
                  q("style", "parent-style-name"): "Standard", q("style", "class"): "text",
              })
              ET.SubElement(heading, q("style", "paragraph-properties"), {
                  q("fo", "keep-with-next"): "always", q("fo", "margin-top"): "1.2cm",
                  q("fo", "margin-bottom"): "0.35cm",
              })
              ET.SubElement(heading, q("style", "text-properties"), {
                  q("fo", "font-size"): "16pt", q("fo", "font-weight"): "bold",
              })
              page_layouts = ET.SubElement(styles, q("office", "automatic-styles"))
              layout = ET.SubElement(page_layouts, q("style", "page-layout"), {q("style", "name"): "DefaultPage"})
              ET.SubElement(layout, q("style", "page-layout-properties"), {
                  q("fo", "page-width"): "21cm", q("fo", "page-height"): "29.7cm",
                  q("fo", "margin-top"): "2.2cm", q("fo", "margin-bottom"): "2.2cm",
                  q("fo", "margin-left"): "2.4cm", q("fo", "margin-right"): "2.4cm",
              })
              master_styles = ET.SubElement(styles, q("office", "master-styles"))
              ET.SubElement(master_styles, q("style", "master-page"), {
                  q("style", "name"): "Default", q("style", "page-layout-name"): "DefaultPage",
              })
              styles_xml = ET.tostring(styles, encoding="utf-8", xml_declaration=True)

              meta = ET.Element(q("office", "document-meta"), {q("office", "version"): "1.3"})
              meta_body = ET.SubElement(meta, q("office", "meta"))
              ET.SubElement(meta_body, q("dc", "title")).text = title
              ET.SubElement(meta_body, q("dc", "creator")).text = author
              ET.SubElement(meta_body, q("dc", "source")).text = "https://www.gutenberg.org/ebooks/" + str(source_id)
              meta_xml = ET.tostring(meta, encoding="utf-8", xml_declaration=True)

              manifest = ET.Element(q("manifest", "manifest"), {q("manifest", "version"): "1.3"})
              ET.SubElement(manifest, q("manifest", "file-entry"), {
                  q("manifest", "full-path"): "/", q("manifest", "media-type"): "application/vnd.oasis.opendocument.text",
                  q("manifest", "version"): "1.3",
              })
              for path, media in [
                  ("content.xml", "text/xml"), ("styles.xml", "text/xml"),
                  ("meta.xml", "text/xml"), ("META-INF/manifest.xml", "text/xml"),
              ]:
                  ET.SubElement(manifest, q("manifest", "file-entry"), {
                      q("manifest", "full-path"): path, q("manifest", "media-type"): media,
                  })
              manifest_xml = ET.tostring(manifest, encoding="utf-8", xml_declaration=True)

              destination.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(destination, "w") as package:
                  package.writestr("mimetype", "application/vnd.oasis.opendocument.text", compress_type=zipfile.ZIP_STORED)
                  package.writestr("content.xml", content_xml, compress_type=zipfile.ZIP_DEFLATED)
                  package.writestr("styles.xml", styles_xml, compress_type=zipfile.ZIP_DEFLATED)
                  package.writestr("meta.xml", meta_xml, compress_type=zipfile.ZIP_DEFLATED)
                  package.writestr("META-INF/manifest.xml", manifest_xml, compress_type=zipfile.ZIP_DEFLATED)

          library = Path("src/kwiddle/books")
          library.mkdir(parents=True, exist_ok=True)
          for ebook_id, title, author, filename in books:
              url = f"https://www.gutenberg.org/cache/epub/{ebook_id}/pg{ebook_id}.txt"
              request = urllib.request.Request(url, headers={"User-Agent": "KwiddleBookLibrary/1.0 (open-source reader)"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  source_text = response.read().decode("utf-8-sig", errors="replace")
              destination = library / filename
              make_odt(destination, title, author, ebook_id, source_text)
              print(f"Built {destination} ({destination.stat().st_size:,} bytes)")
          PY

      - name: Commit complete books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kwiddle/books/*.odt
          if git diff --cached --quiet; then
            echo "All public-domain books are already current."
            exit 0
          fi
          git commit -m "Add five complete public-domain classics"
          git push origin HEAD:main
