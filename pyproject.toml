[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kwiddle"
version = "0.1.0"
description = "Desktop book reader powered by kwloader"
readme = "README.md"
requires-python = ">=3.13, <3.16"
dependencies = [
    "kwloader @ git+https://github.com/cloudberrypitech/kwloader",
    "auto-py-to-exe (>=2.50.1,<3.0.0)"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
