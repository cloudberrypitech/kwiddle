[project]
name = "kwiddle"
version = "0.0.1"
description = ""
authors = [
    {name = "CloudberryPiTech",email = "bubblesbakale@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyfiglet (>=1.0.4,<2.0.0)"
]

[tool.poetry]
packages = [{include = "kwiddle", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "twine (>=7.0.0,<8.0.0)"
]

[[tool.poetry.repositories]]
name = "github"
url = "https://pypi.pkg.github.com/cloudberrypitech"
