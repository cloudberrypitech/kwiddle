[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kwiddle"
version = "0.3.0"
description = "Desktop book reader powered by kwloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kwloader @ git+https://github.com/cloudberrypitech/kwloader@main",
    "Pillow>=10.0.0,<13.0.0",
    "CairoSVG>=2.7.1,<3.0.0",
    "pyfiglet>=1.0.4,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kwiddle = "kwiddle.maincode:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kwiddle = ["books/*", "*.png"]
